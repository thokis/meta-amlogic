#@TYPE: Machine
#@NAME: aml-s805x-ac machine
#@DESCRIPTION: Reference machine configuration for the amlogic p241 reference machine

require conf/machine/include/amlogic-s805x.inc

# Just building for now
require conf/machine/include/amlogic-default-providers.inc

KERNEL_DEVICETREE = "amlogic/meson-gxl-s805x-p241.dtb"
UBOOT_MACHINE = "p241_defconfig"

# Files to place on the first vfat partition (Using beagle method)
IMAGE_BOOT_FILES ?= "${KERNEL_IMAGETYPE} \
		     meson-gxl-s805x-p241.dtb"

# By default, we will put u-boot in the eMMC boot0 partition
WKS_FILE ?= "amlogic-none.wks"
do_image_wic[depends] += "mtools-native:do_populate_sysroot dosfstools-native:do_populate_sysroot"

MACHINE_FEATURES_append = " alsa ext2 screen usbgadget usbhost vfat"
