#@TYPE: Machine
#@NAME: aml-s805x-ac machine
#@DESCRIPTION: Reference machine configuration for libretech's aml-s805x-ac machine

PREFERRED_PROVIDER:virtual/kernel ?= "linux-yocto"
KERNEL_DEVICETREE ?= "amlogic/meson-axg-s400.dtb"
UBOOT_MACHINE ?= "s400_defconfig"
MACHINE_FEATURES:append = " alsa bluetooth ext2 usbgadget usbhost vfat wifi"

# We never supported the NAND variant - just care for eMMC
NOSEM_BOOT_DEV = "emmc"

require conf/machine/include/amlogic-a113.inc

# Use wic on this machine
require conf/machine/include/nosem-wic.inc
