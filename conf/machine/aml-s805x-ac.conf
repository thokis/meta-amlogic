#@TYPE: Machine
#@NAME: aml-s805x-ac machine
#@DESCRIPTION: Reference machine configuration for libretech's aml-s805x-ac machine

PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
KERNEL_DEVICETREE ?= "amlogic/meson-gxl-s805x-libretech-ac.dtb"
UBOOT_MACHINE ?= "libretech-ac_defconfig"
MACHINE_FEATURES:append = " alsa ext2 screen usbgadget usbhost vfat"

# TODO: make this customizable using the boot dev override
# Boot dev options are:
#  - SPI: preferred
#  - eMMC: possible if present
AMLOGIC_BOOT_DEV = "spi"

require conf/machine/include/amlogic-s805x.inc

# Use wic on this machine
require conf/machine/include/amlogic-wic.inc
