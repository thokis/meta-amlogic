# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "nosem"
BBFILE_PATTERN:nosem = "^${LAYERDIR}/"
BBFILE_PRIORITY:nosem = "7"

LAYERDEPENDS:nosem = "core"
LAYERSERIES_COMPAT:nosem = "hardknott"
