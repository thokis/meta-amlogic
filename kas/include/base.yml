header:
  version: 17

machine: aml-s905x-cc
target:
  - core-image-base

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"

local_conf_header:
  root-nopass: |
    EXTRA_IMAGE_FEATURES += "debug-tweaks"
  standard: |
    CONF_VERSION = "2"
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"
  diskmon: |
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
  # Disable u-boot video and usb kbd by default
  no-video-usb-kbd: |
    UBOOT_ILOVEUART ??= "1"
