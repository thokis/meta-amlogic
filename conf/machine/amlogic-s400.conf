#@TYPE: Machine
#@NAME: aml-s805x-ac machine
#@DESCRIPTION: Reference machine configuration for libretech's aml-s805x-ac machine

require conf/machine/include/amlogic-a113.inc

# Just building for now
require conf/machine/include/amlogic-default-providers.inc

KERNEL_DEVICETREE = "amlogic/meson-axg-s400.dtb"
UBOOT_MACHINE = "s400_defconfig"

# Files to place on the first vfat partition (Using beagle method)
IMAGE_BOOT_FILES ?= "${KERNEL_IMAGETYPE} \
		     meson-axg-s400.dtb"
WKS_FILE ?= "amlogic-emmc.wks"
do_image_wic[depends] += "mtools-native:do_populate_sysroot dosfstools-native:do_populate_sysroot"

MACHINE_FEATURES = " alsa bluetooth ext2 usbgadget usbhost vfat wifi"
