#@TYPE: Machine
#@NAME: khadas-vim3 machine
#@DESCRIPTION: Reference machine configuration for khadas VIM3 machine

require conf/machine/include/amlogic-a311d.inc

# Just building for now
require conf/machine/include/amlogic-default-providers.inc

KERNEL_DEVICETREE = "amlogic/meson-g12b-a311d-khadas-vim3.dtb"
UBOOT_MACHINE = "khadas-vim3_defconfig"

# Files to place on the first vfat partition (Using beagle method)
IMAGE_BOOT_FILES ?= "${KERNEL_IMAGETYPE} \
		     meson-g12b-a311d-khadas-vim3.dtb"
IMAGE_FSTYPES += "tar.bz2 wic wic.bz2 wic.bmap"
WKS_FILE ?= "amlogic-sdcard.wks"
do_image_wic[depends] += "mtools-native:do_populate_sysroot dosfstools-native:do_populate_sysroot"

MACHINE_FEATURES_append = " alsa bluetooth screen usbgadget usbhost vfat wifi"
