#@TYPE: Machine
#@NAME: u200 s905d2 reference machine
#@DESCRIPTION: Reference machine configuration for the Amlogic u200

PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
KERNEL_DEVICETREE ?= "amlogic/meson-g12a-u200.dtb"
UBOOT_MACHINE ?= "u200_defconfig"
MACHINE_FEATURES:append = " alsa bluetooth screen usbgadget usbhost vfat wifi"

# TODO: make this customizable using the boot dev override
# Boot dev options are:
#  - SDcard
#  - eMMC: if present
NOSEM_BOOT_DEV = "sdcard"

require conf/machine/include/amlogic-s905d2.inc

# Use wic on this machine
require conf/machine/include/nosem-wic.inc
