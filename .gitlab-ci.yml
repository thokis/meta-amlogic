image: ghcr.io/siemens/kas/kas

stages:
  - build

variables:
  DL_DIR: /cache/yocto/downloads
  SSTATE_DIR: /cache/yocto/amlogic/sstate

.build:
  interruptible: true
  stage: build
  script:
    - echo DL_DIR = $DL_DIR
    - echo SSTATE_DIR = $SSTATE_DIR
    - echo WORKDIR = $CI_PROJECT_DIR/$CI_JOB_ID
    - mkdir --verbose --parents $SSTATE_DIR
    - mkdir --verbose --parents $DL_DIR
    - mkdir --verbose --parents  $CI_PROJECT_DIR/$CI_JOB_ID
    - KAS_WORK_DIR=$CI_PROJECT_DIR/$CI_JOB_ID kas build $KAS_YAML_CFG

build:
  extends: .build
  only:
    - scarthgap
    - nanbield
    - tags
  parallel:
    matrix:
      - KAS_MACHINE:
          - aml-a311d-cc
          - aml-s905d3-cc
          - aml-s905x-cc
          - aml-s805x-ac
          - amlogic-p241
          - amlogic-s400
          - amlogic-u200
          - khadas-vim3
          - khadas-vim3l
        KAS_TARGET: core-image-base
        KAS_YAML_CFG:
          - kas/default.yml
  after_script:
    - rm -rf $CI_PROJECT_DIR/$CI_JOB_ID

smoke:
  extends: .build
  only:
    - /^smoke*/
  parallel:
    matrix:
      - KAS_MACHINE: aml-s905x-cc
        KAS_TARGET: core-image-minimal
        KAS_YAML_CFG:
          - kas/default.yml
